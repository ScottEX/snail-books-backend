name: CI/CD

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 语法检查
        run: |
          python -m py_compile app.py
          python -m py_compile i18n_backend.py
          for f in shared/*.py routes/*.py; do python -m py_compile "$f"; done
          echo "✅ 语法检查通过"
      - name: Schema 一致性检查
        run: python scripts/check_schema_consistency.py
      - name: 助手和账务写入回归测试
        run: |
          python -m pip install -r requirements.txt
          python -m unittest discover -s tests

  deploy-staging:
    needs: test
    if: github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    steps:
      - name: Build web assets
        uses: actions/checkout@v4
        with:
          repository: ScottEX/snail-books-web
          ref: develop
          path: web-build
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: npm ci & build:web
        working-directory: web-build
        run: |
          npm ci
          npm run build:web

      - name: Snapshot backup (staging)
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            mkdir -p /opt/backups
            for db in /opt/snail-books-backend-staging/data/*.db; do
              [ -f "$db" ] || continue
              base=$(basename "$db" .db)
              cp "$db" "/opt/backups/snail-staging-${base}-$(date +%Y%m%d_%H%M%S).db"
              ls -t /opt/backups/snail-staging-${base}-*.db | tail -n +4 | xargs -r rm -f
            done

      - name: Clean stale web dist (staging)
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: rm -rf /opt/snail-books-backend-staging/static/web-build/dist/*

      - name: Sync web dist → server backend/static (staging)
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "web-build/dist/*"
          target: "/opt/snail-books-backend-staging/static/"
          strip_components: 0
          overwrite: true

      - name: Checkout backend
        uses: actions/checkout@v4
        with:
          repository: ScottEX/snail-books-backend
          ref: develop
          path: backend

      - name: Clean stale backend files (staging)
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            rm -f /opt/snail-books-backend-staging/app.py
            rm -f /opt/snail-books-backend-staging/i18n_backend.py
            rm -f /opt/snail-books-backend-staging/requirements.txt
            rm -rf /opt/snail-books-backend-staging/shared/
            rm -rf /opt/snail-books-backend-staging/routes/
            rm -rf /opt/snail-books-backend-staging/templates/

      - name: SCP backend code → staging
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "backend/requirements.txt,backend/app.py,backend/i18n_backend.py,backend/shared/*,backend/routes/*,backend/templates/**"
          target: "/opt/snail-books-backend-staging/"
          strip_components: 1

      - name: Deploy nginx config (staging)
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "backend/deploy/nginx/test.rowanlan.xyz.conf"
          target: "/etc/nginx/sites-enabled/"
          strip_components: 3

      - name: Reload nginx (staging)
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: nginx -t && systemctl reload nginx

      - name: Configure DeepSeek (staging)
        uses: appleboy/ssh-action@v1
        env:
          STAGING_DEEPSEEK_API_KEY: ${{ secrets.STAGING_DEEPSEEK_API_KEY }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: STAGING_DEEPSEEK_API_KEY
          script: |
            set -eu
            case "${STAGING_DEEPSEEK_API_KEY:-}" in
              '') echo "No CI-managed DeepSeek secret for staging"; exit 0 ;;
              *[!a-zA-Z0-9_-]*) echo "Invalid DeepSeek secret format" >&2; exit 1 ;;
            esac

            umask 077
            env_dir=/etc/snail-books-staging
            mkdir -p "$env_dir"
            env_tmp=$(mktemp "$env_dir/.ci-deepseek.XXXXXX")
            trap 'rm -f "$env_tmp"' EXIT
            printf 'DEEPSEEK_API_KEY=%s\n' "$STAGING_DEEPSEEK_API_KEY" > "$env_tmp"
            mv -f "$env_tmp" "$env_dir/ci-deepseek.env"

            unit_dir=/etc/systemd/system/snail-books-staging.service.d
            mkdir -p -m 0755 "$unit_dir"
            printf '[Service]\nEnvironmentFile=%s/ci-deepseek.env\n' "$env_dir" > "$unit_dir/90-ci-deepseek.conf"
            systemctl daemon-reload

      - name: Install deps & restart backend (staging)
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            /opt/snail-books-backend-staging/venv/bin/pip install -r /opt/snail-books-backend-staging/requirements.txt
            systemctl restart snail-books-staging
            sleep 2
            systemctl is-active snail-books-staging
            curl -sSf -o /dev/null http://localhost:8601/ && echo "✅ Staging 冒烟测试通过" || { echo "❌ Staging 冒烟测试失败"; exit 1; }
            echo "✅ Staging 部署完成"

  search-smoke-staging:
    needs: deploy-staging
    if: github.ref == 'refs/heads/develop' && needs.deploy-staging.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Verify deployed chat with navigation and cited public analysis
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -eu
            cd /opt/snail-books-backend-staging
            if [ -r /etc/snail-books-staging/ci-deepseek.env ]; then
              set -a
              . /etc/snail-books-staging/ci-deepseek.env
              set +a
            fi
            ./venv/bin/python - <<'PY'
            import os
            import re
            from pathlib import Path
            from tempfile import TemporaryDirectory

            with TemporaryDirectory(prefix='assistant-chat-smoke-') as temporary:
                root = Path(temporary)
                os.environ.update(APP_ENV='staging', FLASK_SECRET_KEY='assistant-chat-smoke-fixture',
                                  DB=str(root / 'smoke.sqlite'), BG_DIR=str(root / 'bg'),
                                  INVOICE_FILE_DIR=str(root / 'invoices'), EXPENSE_IMG_DIR=str(root / 'expenses'))

                from app import app
                from shared.db import get_db

                with get_db() as db:
                    db.execute("INSERT INTO users (id, username, password, is_verified, is_disabled) "
                               "VALUES (1, 'ci-chat-fixture', 'fixture', 1, 0)")
                client = app.test_client()
                with client.session_transaction() as session:
                    session['user_id'] = 1
                revision = None
                cases = (
                    ('个人资料', ['profile']),
                    ('个人', ['profile']),
                    ('历史', ['expense', 'revenue', 'procurementHistory', 'reconciliation',
                             'invoiceRecords', 'feeHistory', 'dividendHistory']),
                    ('螺蛳粉行业分析', None),
                )
                for index, (question, expected) in enumerate(cases):
                    response = client.post('/api/assistant/chat', json={
                        'text': question, 'revision': revision, 'request_id': f'ci-chat-smoke-{index}',
                    })
                    assert response.status_code == 200, f'{question}: HTTP {response.status_code}'
                    state = response.get_json()
                    revision, turn = state['revision'], state['turns'][-1]
                    assert not turn['notice'], f"{question}: {turn['notice']}"
                    if expected is not None:
                        assert turn['destinations'] == expected, f'{question}: unexpected destinations'
                        print(f'{question}: {len(expected)} navigation destination(s)', flush=True)
                    else:
                        sources = turn.get('sources') or []
                        citations = re.findall(r'\[(\d+)\]', turn.get('message') or '')
                        assert sources and citations, f'{question}: missing sources or cited answer'
                        assert all(1 <= int(citation) <= len(sources) for citation in citations)
                        print(f'{question}: cited response with {len(sources)} live source(s)', flush=True)
            PY

  deploy-production:
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Build web assets
        uses: actions/checkout@v4
        with:
          repository: ScottEX/snail-books-web
          ref: main
          path: web-build
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: npm ci & build:web
        working-directory: web-build
        run: |
          npm ci
          npm run build:web

      - name: Snapshot backup (production)
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            mkdir -p /opt/backups
            for db in /opt/snail-books-backend/data/*.db; do
              [ -f "$db" ] || continue
              base=$(basename "$db" .db)
              cp "$db" "/opt/backups/snail-prod-${base}-$(date +%Y%m%d_%H%M%S).db"
              ls -t /opt/backups/snail-prod-${base}-*.db | tail -n +4 | xargs -r rm -f
            done

      - name: Clean stale web dist (production)
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: rm -rf /opt/snail-books-backend/static/web-build/dist/*

      - name: Sync web dist → server backend/static (production)
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "web-build/dist/*"
          target: "/opt/snail-books-backend/static/"
          strip_components: 0
          overwrite: true

      - name: Checkout backend
        uses: actions/checkout@v4
        with:
          repository: ScottEX/snail-books-backend
          ref: main
          path: backend

      - name: Clean stale backend files (production)
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            rm -f /opt/snail-books-backend/app.py
            rm -f /opt/snail-books-backend/i18n_backend.py
            rm -f /opt/snail-books-backend/requirements.txt
            rm -rf /opt/snail-books-backend/shared/
            rm -rf /opt/snail-books-backend/routes/
            rm -rf /opt/snail-books-backend/templates/

      - name: SCP backend code → production
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "backend/requirements.txt,backend/app.py,backend/i18n_backend.py,backend/shared/*,backend/routes/*,backend/templates/**"
          target: "/opt/snail-books-backend/"
          strip_components: 1

      - name: Install deps & restart backend (production)
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            /opt/snail-books-backend/venv/bin/pip install -r /opt/snail-books-backend/requirements.txt
            systemctl restart snail-books
            sleep 2
            systemctl is-active snail-books
            curl -sSf -o /dev/null http://localhost:8600/ && echo "✅ 生产冒烟测试通过" || { echo "❌ 生产冒烟测试失败"; exit 1; }
            echo "✅ 生产部署完成"
